name: Harness CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

# NOTE: Backend jobs (lint, typecheck, tests) require api/ to be scaffolded
# and api/pyproject.toml to exist. They will fail until repo-002 + back-001
# are implemented. Frontend job requires web/ to be scaffolded.

jobs:
  backend-lint:
    name: Ruff (api/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/pyproject.toml
      - run: pip install ruff
      - run: ruff check .

  backend-typecheck:
    name: Mypy (api/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy .

  backend-tests:
    name: Pytest (api/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: personal_library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/personal_library_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/personal_library_test
      LIBRARY_USERNAME: admin
      LIBRARY_PASSWORD: testpassword
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  frontend-build:
    name: Next.js build (web/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docs-check:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if HANDOFF.md was updated
        run: |
          git diff --name-only origin/main...HEAD 2>/dev/null | grep -q "HANDOFF.md" || \
          echo "::notice::HANDOFF.md was not updated in this PR"
      - name: Validate STATUS.json
        run: |
          python3 -c "import json; json.load(open('STATUS.json'))" && echo "STATUS.json is valid JSON"

  harness-gate:
    name: Harness Gate
    needs: [backend-lint, backend-typecheck, backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Harness approved. Ready for human review."
